[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redsim"
version = "0.1.0"
description = "Minecraft Java Edition 26.3 redstone simulator (port of the server-side update logic)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
redsim = "redsim.ui.app:main"
redsim-cli = "redsim.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools", "."]
# snapshots of an agent's scratch scripts next to work-in-progress worlds
extend-exclude = ["experiments/wip"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["redsim"]
ignore_missing_imports = true
warn_unused_ignores = true
